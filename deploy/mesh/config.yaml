# Headscale control-plane config — ADR 0012 (private overlay network).
#
# Used by the `mesh` compose profile (docker-compose.prod.yml). Operator console
# is reachable at HEADSCALE_BIND (default 8080); the WireGuard Noise port is
# HEADSCALE_WG_BIND (default 41641/udp) and MUST be open for nodes to connect.
#
# First run: obtain an auth key so Tailscale clients can join:
#   docker compose -f docker-compose.prod.yml --profile mesh exec headscale \
#     headscale users create chaste
#   docker compose -f docker-compose.prod.yml --profile mesh exec headscale \
#     headscale preauthkeys create --user chaste --reusable --expiration 24h
#   # paste the returned key into TAILSCALE_AUTH_KEY, then:
#   docker compose -f docker-compose.prod.yml --profile mesh up -d

server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite3
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: false
  base_domain: example.com
  nameservers:
    global: []
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/acl.json

randomize_client_port: false
ephemeral_node_inactivity_timeout: 30m
