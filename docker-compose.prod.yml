# Production Compose — ChasteBusinessOS (api + web + worker + postgres + redis).
#
#   cp .env.example .env   # then set real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets are REQUIRED (fail closed): CHASTE_SESSION_SECRET and
# POSTGRES_PASSWORD have no shipped defaults. Set DATABASE_URL explicitly or
# it is derived from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB.
#
# Optional private overlay (ADR 0012 — Headscale): run with
#   docker compose -f docker-compose.prod.yml --profile mesh up -d
# which adds a Headscale control plane + Tailscale sidecars and lets hosts
# reach services at tailnet IPs. Set API_BIND=/WEB_BIND= (empty) to stop
# publishing those ports to the host and rely on the tailnet (see README).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chaste}
    volumes:
      - chaste_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaste} -d ${POSTGRES_DB:-chaste}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # F10 — Redis requires auth (like Postgres) so a known/empty password never
    # ships; REDIS_PASSWORD is mandatory for the compose deploy.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - chaste_redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://chaste:chaste@postgres:5432/chaste}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      API_URL: ${API_URL:-http://localhost:3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-chaste}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chaste}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      CHASTE_SESSION_SECRET: ${CHASTE_SESSION_SECRET:?set CHASTE_SESSION_SECRET}
      CHASTE_SESSION_TOKEN_TTL: ${CHASTE_SESSION_TOKEN_TTL:-2592000}
      # F1 — production must never ship the anonymous-admin fallback.
      CHASTE_ALLOW_ANON_ADMIN: "false"
      CHASTE_ADMIN_TOKEN: ${CHASTE_ADMIN_TOKEN:-}
      CHASTE_REGION: ${CHASTE_REGION:-local}
      CHASTE_REGIONS: ${CHASTE_REGIONS:-local}
      # F10 — bootstrap admin is opt-in and only for first boot; require an
      # explicit admin token instead of anonymous bootstrap admin.
      CHASTE_BOOTSTRAP: ${CHASTE_BOOTSTRAP:-false}
      CHASTE_ORG_NAME: ${CHASTE_ORG_NAME:-Primary Organization}
      CHASTE_ADMIN_EMAIL: ${CHASTE_ADMIN_EMAIL:-admin@localhost}
      CHASTE_ADMIN_NAME: ${CHASTE_ADMIN_NAME:-System Admin}
      CHASTE_AI_PROVIDER: ${CHASTE_AI_PROVIDER:-none}
      CHASTE_AI_MODEL: ${CHASTE_AI_MODEL:-meta/llama-3.1-8b-instruct}
      CHASTE_AI_BASE_URL: ${CHASTE_AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      CHASTE_RESEND_API_KEY: ${CHASTE_RESEND_API_KEY:-}
      CHASTE_RESEND_FROM: ${CHASTE_RESEND_FROM:-}
      CHASTE_SMTP_HOST: ${CHASTE_SMTP_HOST:-}
      CHASTE_SMTP_PORT: ${CHASTE_SMTP_PORT:-587}
      CHASTE_SMTP_SECURE: ${CHASTE_SMTP_SECURE:-false}
      CHASTE_SMTP_USER: ${CHASTE_SMTP_USER:-}
      CHASTE_SMTP_PASS: ${CHASTE_SMTP_PASS:-}
      CHASTE_SMTP_FROM: ${CHASTE_SMTP_FROM:-}
      CHASTE_EMAIL_FROM: ${CHASTE_EMAIL_FROM:-}
      CHASTE_BUZZ_WEBHOOK_SECRET: ${CHASTE_BUZZ_WEBHOOK_SECRET:-}
      CHASTE_BUZZ_OUTBOUND_WEBHOOK_URL: ${CHASTE_BUZZ_OUTBOUND_WEBHOOK_URL:-}
      CHASTE_BACKUP_KEY: ${CHASTE_BACKUP_KEY:-}
      CHASTE_BACKUP_DIR: ${CHASTE_BACKUP_DIR:-}
      CHASTE_S3_BUCKET: ${CHASTE_S3_BUCKET:-}
      CHASTE_S3_REGION: ${CHASTE_S3_REGION:-us-east-1}
      CHASTE_S3_ACCESS_KEY_ID: ${CHASTE_S3_ACCESS_KEY_ID:-}
      CHASTE_S3_SECRET_ACCESS_KEY: ${CHASTE_S3_SECRET_ACCESS_KEY:-}
      CHASTE_S3_SESSION_TOKEN: ${CHASTE_S3_SESSION_TOKEN:-}
      CHASTE_S3_ENDPOINT: ${CHASTE_S3_ENDPOINT:-}
    ports:
      # Empty API_BIND (=) hides the host mapping and relies on the mesh tailnet.
      - "${API_BIND-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-chaste}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chaste}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      CHASTE_REGION: ${CHASTE_REGION:-local}
      CHASTE_REGIONS: ${CHASTE_REGIONS:-local}
      CHASTE_AI_PROVIDER: ${CHASTE_AI_PROVIDER:-none}
      CHASTE_AI_MODEL: ${CHASTE_AI_MODEL:-meta/llama-3.1-8b-instruct}
      CHASTE_AI_BASE_URL: ${CHASTE_AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      CHASTE_RESEND_API_KEY: ${CHASTE_RESEND_API_KEY:-}
      CHASTE_RESEND_FROM: ${CHASTE_RESEND_FROM:-}
      CHASTE_SMTP_HOST: ${CHASTE_SMTP_HOST:-}
      CHASTE_SMTP_PORT: ${CHASTE_SMTP_PORT:-587}
      CHASTE_SMTP_USER: ${CHASTE_SMTP_USER:-}
      CHASTE_SMTP_PASS: ${CHASTE_SMTP_PASS:-}
      CHASTE_SMTP_FROM: ${CHASTE_SMTP_FROM:-}
      CHASTE_EMAIL_FROM: ${CHASTE_EMAIL_FROM:-}
      CHASTE_BUZZ_WEBHOOK_SECRET: ${CHASTE_BUZZ_WEBHOOK_SECRET:-}
      CHASTE_BUZZ_OUTBOUND_WEBHOOK_URL: ${CHASTE_BUZZ_OUTBOUND_WEBHOOK_URL:-}
      CHASTE_BACKUP_KEY: ${CHASTE_BACKUP_KEY:-}
      CHASTE_BACKUP_DIR: ${CHASTE_BACKUP_DIR:-}
      CHASTE_S3_BUCKET: ${CHASTE_S3_BUCKET:-}
      CHASTE_S3_REGION: ${CHASTE_S3_REGION:-us-east-1}
      CHASTE_S3_ACCESS_KEY_ID: ${CHASTE_S3_ACCESS_KEY_ID:-}
      CHASTE_S3_SECRET_ACCESS_KEY: ${CHASTE_S3_SECRET_ACCESS_KEY:-}
      CHASTE_S3_SESSION_TOKEN: ${CHASTE_S3_SESSION_TOKEN:-}
      CHASTE_S3_ENDPOINT: ${CHASTE_S3_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        # Baked into browser bundles; the SSR server reads API_URL at runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-http://localhost:3001}
    ports:
      # Empty WEB_BIND (=) hides the host mapping and relies on the mesh tailnet.
      - "${WEB_BIND-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Private overlay mesh (ADR 0012) — opt-in via --profile mesh ──────────
  # Control plane: Headscale (fully open source, BSD). Join nodes use the
  # official Tailscale clients (tailscale/tailscale sidecars) sharing the app
  # containers' network namespaces, so api/web/worker get tailnet IPs without
  # privileged mode on the app itself.
  #
  # First-run setup (see docs/deploy/README.md): create the user + a preauth
  # key on the headscale container, then put the key in TAILSCALE_AUTH_KEY.
  headscale:
    image: headscale/headscale:v0.23.0
    profiles: ["mesh"]
    command: headscale serve
    environment:
      HEADSCALE_CONFIG_FILE: /etc/headscale/config.yaml
    volumes:
      - chaste_headscale:/var/lib/headscale
      - ./deploy/mesh/config.yaml:/etc/headscale/config.yaml:ro
      - ./deploy/mesh/acl.json:/etc/headscale/acl.json:ro
    ports:
      - "${HEADSCALE_BIND:-8080}:8080"
      - "${HEADSCALE_WG_BIND:-41641}:41641/udp"
    restart: unless-stopped

  # Tailscale sidecars — share each app service's network namespace to put it
  # on the tailnet. Requires the sidecar to create the WireGuard interface
  # inside that shared netns (NET_ADMIN on the sidecar container only).
  ts-api:
    image: tailscale/tailscale:v1.66.4
    profiles: ["mesh"]
    hostname: api
    environment:
      TS_AUTH_KEY: ${TAILSCALE_AUTH_KEY:?set TAILSCALE_AUTH_KEY and preauth the mesh}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:chaste-app
      TS_USERSPACE: "false"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - chaste_ts_api:/var/lib/tailscale
    network_mode: service:api
    depends_on:
      - headscale
    restart: unless-stopped

  ts-web:
    image: tailscale/tailscale:v1.66.4
    profiles: ["mesh"]
    hostname: web
    environment:
      TS_AUTH_KEY: ${TAILSCALE_AUTH_KEY:?set TAILSCALE_AUTH_KEY and preauth the mesh}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:chaste-app
      TS_USERSPACE: "false"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - chaste_ts_web:/var/lib/tailscale
    network_mode: service:web
    depends_on:
      - headscale
    restart: unless-stopped

  ts-worker:
    image: tailscale/tailscale:v1.66.4
    profiles: ["mesh"]
    hostname: worker
    environment:
      TS_AUTH_KEY: ${TAILSCALE_AUTH_KEY:?set TAILSCALE_AUTH_KEY and preauth the mesh}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:chaste-worker
      TS_USERSPACE: "false"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - chaste_ts_worker:/var/lib/tailscale
    network_mode: service:worker
    depends_on:
      - headscale
    restart: unless-stopped

volumes:
  chaste_pg:
  chaste_redis:
  chaste_headscale:
  chaste_ts_api:
  chaste_ts_web:
  chaste_ts_worker:
