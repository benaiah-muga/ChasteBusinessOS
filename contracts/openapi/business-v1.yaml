            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: executeTeamAction
      summary: Perform a governed organization team action
      description: >-
        Executes one of createRole, setPermissions, assignRole, or invite
        through its governed IAM capability. Cookie and bearer authentication
        are supported. Cookie-authenticated requests require an exact same-
        origin Origin header (no Referer fallback); bearer requests bypass
        this browser-origin check. A supplied Authorization value must be a
        valid Bearer value and never falls back to the cookie. With no
        X-Organization-ID, the active-organization cookie/session is used; an
        explicit selector must match the resolved organization. Invalid
        organization selection returns 401 on this write route. Requests use
        an `intentId` to make capability execution replay-safe. The per-action
        input body is limited to 65536 bytes. Unknown object
        properties are accepted and ignored by Go. All responses include
        Cache-Control: no-store. Unsupported methods return 405 before
        authentication; Allow lists the currently enabled Go methods.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization membership and must match the session.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: JSON request body limited to 65536 bytes. Unknown properties are ignored by Go.
        x-maxBodyBytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamWriteRequest"
      responses:
        "200":
          description: The selected action completed. The data shape depends on action.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWriteSuccess"
        "202":
          description: Capability execution requires approval and has not completed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWritePending"
        "400":
          description: The request body, action, intent, or action-specific fields are invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session, organization selection, or capability scope is invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The cookie request origin is not same-origin or the actor is not an organization member.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The governed IAM capability refused the mutation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWriteFailure"
        "500":
          description: Capability execution failed unexpectedly.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Team dependencies are unavailable or the capability returned malformed success data.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The exact-path mount rejected an unsupported method before authentication.
          headers:
            Allow:
              description: Currently enabled GET and POST methods. The value reflects feature-flag configuration.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/support/channels:
    get:
      operationId: getSupportChannels
      summary: Read support channel settings
      description: Reads the current organization's support channel settings. The embed token is returned only to members with permission to manage support.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Current support channel settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChannelsResponse"
        "401":
          description: The session is invalid or the actor is not an organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The support module is not enabled for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The settings could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Support settings are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: updateSupportChannels
      summary: Update support channel settings
      description: Updates support settings for the active organization. Cookie-authenticated requests must include a same-origin Origin header. At least one field must be provided.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID for this exact settings update. Reuse it with the same body after an uncertain result.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChannelsPatch"
      responses:
        "202":
          description: The change is waiting for an authorized reviewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalResponse"
        "200":
          description: Updated support channel settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChannelsResponse"
        "400":
          description: The patch is malformed, empty, or outside the supported bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not an organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The origin is not allowed or the actor cannot manage support settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The support module is not enabled for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The settings could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The capability rejected the requested change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Support settings are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, baseCurrency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
    OrganizationListResponse:
      type: object
      additionalProperties: false
      required: [activeOrgId, orgs]
      properties:
        activeOrgId:
          type: [string, "null"]
          format: uuid
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"
    OrganizationSwitchRequest:
      type: object
      additionalProperties: true
      required: [orgId]
      properties:
        orgId:
          type: string
          format: uuid
    OrganizationSwitchSuccess:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    AgentSoulResponse:
      type: object
      additionalProperties: false
      required: [agentSoul]
      properties:
        agentSoul:
          type: string
    OrganizationSoulPatchRequest:
      type: object
      additionalProperties: true
      required: [agentSoul]
      properties:
        agentSoul:
          type: string
          x-maxUtf16Length: 8000
          description: Trimmed before storage; an empty or whitespace-only value clears the persona. The server rejects values exceeding 8000 UTF-16 code units.
    OrganizationWriteSuccess:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Signal:
      type: object
      additionalProperties: false
      required: [id, severity, module, subject, detail]
      properties:
        id:
          type: string
          minLength: 1
        severity:
          type: string
          enum: [red, orange, green]
        module:
          type: string
          minLength: 1
        subject:
          type: string
        detail:
          type: string
        evidence:
          type: [object, "null"]
          additionalProperties: false
          required: [refType]
          properties:
            refType:
              type: string
            refId:
              type: [string, "null"]
        suggestedAction:
          type: [object, "null"]
          additionalProperties: false
          required: [capabilityId]
          properties:
            capabilityId:
              type: string
              minLength: 1
            inputDraft:
              type: object
              additionalProperties: true
              x-go-type: apicontract.RawJSON
              x-go-type-import:
                path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
                name: apicontract
    SignalResponse:
      type: object
      additionalProperties: false
      required: [signals]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
    DashboardSignal:
      $ref: "#/components/schemas/Signal"
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [signals, money, workingCapital, pipeline, ops, trend, activity]
      properties:
        signals:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/DashboardSignal"
        money:
          type: object
          additionalProperties: false
          required: [revenueMinor, expenseMinor, netIncomeMinor, cashMinor, balanced, assetsMinor, liabilitiesMinor, equityMinor]
          properties:
            revenueMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            expenseMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            netIncomeMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            cashMinor:
              type: [integer, "null"]
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            balanced:
              type: [boolean, "null"]
            assetsMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            liabilitiesMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            equityMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        workingCapital:
          type: object
          additionalProperties: false
          required: [arOutstandingMinor, overdueCount, overdueAmountMinor, apOutstandingMinor]
          properties:
            arOutstandingMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            overdueCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            overdueAmountMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            apOutstandingMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        pipeline:
          type: object
          additionalProperties: false
          required: [stages, openCount, weightedForecastMinor]
          properties:
            stages:
              type: array
              minItems: 6
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                required: [stage, count, valueMinor]
                properties:
                  stage:
                    type: string
                    enum: [lead, qualified, proposal, negotiation, won, lost]
                  count:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
                  valueMinor:
                    type: integer
                    format: int64
                    minimum: -9007199254740991
                    maximum: 9007199254740991
            openCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            weightedForecastMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        ops:
          type: object
          additionalProperties: false
          required: [headcount, pendingLeave, posOpen, lowStock, pendingApprovals, docsParsed, docsAwaitingCoding]
          properties:
            headcount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            pendingLeave:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            posOpen:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [register]
                  properties:
                    register:
                      type: string
            lowStock:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [sku, name]
                properties:
                  sku:
                    type: string
                  name:
                    type: string
            pendingApprovals:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            docsParsed:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            docsAwaitingCoding:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
        trend:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [month, incomeMinor, expenseMinor]
            properties:
              month:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
              incomeMinor:
                type: integer
                format: int64
                minimum: -9007199254740991
                maximum: 9007199254740991
              expenseMinor:
                type: integer
                format: int64
                minimum: -9007199254740991
                maximum: 9007199254740991
        activity:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [seq, kind, capabilityId, actorType, occurredAt]
            properties:
              seq:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              kind:
                type: string
              capabilityId:
                type: [string, "null"]
              actorType:
                type: string
              occurredAt:
                type: string
                format: date-time
    CapabilityExecutionRequest:
      type: object
      additionalProperties: false
      required: [capabilityId, input]
      properties:
        capabilityId:
          type: string
          minLength: 1
          maxLength: 200
          description: Capability registry identifier, limited to 200 Unicode code points by the server. Capability-specific input is validated by its runtime parser.
        input:
          description: Arbitrary JSON value. The Go implementation retains the raw JSON bytes for exact capability parsing and hashing.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
        intentId:
          type: [string, "null"]
          maxLength: 200
          description: Optional idempotency intent, limited to 200 Unicode code points. The server rejects CR, LF, and NUL characters.
    CapabilityExecutionSuccess:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: Arbitrary JSON value. Raw JSON avoids rounding large integer values in Go clients.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
    CapabilityExecutionPending:
      type: object
      additionalProperties: false
      required: [ok, pendingApproval, reason]
      properties:
        ok:
          type: boolean
          const: false
        pendingApproval:
          type: boolean
          const: true
        reason:
          type: string
        approvalId:
          type: string
          minLength: 1
    CapabilityExecutionRefusal:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: false
        data:
          description: Arbitrary JSON value. Raw JSON avoids rounding large integer values in Go clients.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
        error:
          type: string
        approvalId:
          type: string
        approvalRationale:
          type: string
        replayed:
          type: boolean
    ModuleInfo:
      type: object
      additionalProperties: false
      required: [id, label, description, href]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        description:
          type: string
        href:
          type: [string, "null"]
        protected:
          type: boolean
    ModuleSwitchboardResponse:
      type: object
      additionalProperties: false
      required: [catalog, enabledModules, usingDefaults]
      properties:
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
        enabledModules:
          type: array
          items:
            type: string
        usingDefaults:
          type: boolean
    ModuleSwitchboardRequest:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          minItems: 1
