openapi: 3.1.0
info:
  title: Chaste Business API
  version: 1.0.0
  description: Versioned public HTTP contracts shared by the Go API and its clients.
paths:
  /api/org:
    get:
      operationId: getOrganizations
      summary: List organizations available to the signed-in user
      description: >-
        Returns the authenticated user's organization memberships and active
        organization. The Better Auth session cookie is the only supported
        authentication mechanism for this route. The active organization is
        selected from the server-resolved session and HttpOnly active-org
        cookie; X-Organization-ID is not read here. An unverified user receives
        an empty orgs list and a null activeOrgId. Responses include
        Cache-Control: no-store. No Origin header is required for this read.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Organization memberships and active selection.
          headers:
            Cache-Control:
              description: Organization membership data is not stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "401":
          description: The Better Auth session is missing or invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or the organization membership query failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: switchActiveOrganization
      summary: Switch the active organization
      description: >-
        Verifies membership in the requested organization and sets the
        HttpOnly active-org cookie. Only Better Auth cookie sessions are
        supported. The request must include a same-origin Origin header and the
        session email must be verified. This endpoint does not accept an
        X-Organization-ID selector; orgId in the body is the requested target.
        Every response includes Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: JSON request body limited to 4096 bytes.
        x-maxBodyBytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSwitchRequest"
      responses:
        "200":
          description: Active organization cookie was set.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly, SameSite=Lax chaste_active_org cookie scoped to /.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSwitchSuccess"
        "400":
          description: The body is malformed or orgId is not a UUID.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The Better Auth session is missing or invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The Origin is not same-origin, the email is unverified, or the user is not a member of orgId.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or membership verification failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganizationAgentSoul
      summary: Update the organization's agent persona
      description: >-
        Replaces the standing agent persona for the active organization. This
        cookie-session route requires an active organization, iam.admin, and a
        same-origin Origin header. The body is limited to 65536 bytes. The
        agentSoul value is trimmed before storage; whitespace-only text clears
        the persona. Its maximum is 8000 UTF-16 code units. Unknown object
        properties are accepted and ignored.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        x-maxBodyBytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSoulPatchRequest"
      responses:
        "200":
          description: Agent persona was updated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWriteSuccess"
        "400":
          description: The body is malformed, agentSoul is absent or null, or the UTF-16 length exceeds 8000 code units.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or has no active organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The Origin is not same-origin or the actor lacks iam.admin.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or updating the agent persona failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: getOrganizationAgentSoul
      summary: Read the organization's agent persona
      description: >-
        Reads the standing agent persona for the active organization. This
        cookie-session route requires an active organization, but does not
        require iam.admin or an Origin header. Every response includes
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current agent persona.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSoulResponse"
        "401":
          description: The session is invalid or has no active organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or reading the agent persona failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/signals:
    get:
      operationId: getSignals
      summary: Read organization signals
      description: >-
        Lists signals for the authenticated organization through the governed
        signals.list capability. Cookie sessions use the active organization
        from session context unless X-Organization-ID is supplied; bearer
        tokens are resolved against that selected organization. An explicit
        selector must be a single valid UUID matching the actor's membership.
        Invalid nonempty Authorization does not fall back to the cookie. The
        first severity or module query value is used and additional values are
        ignored. Unknown query keys are ignored. Invalid filters return 400.
        The module filter is limited to 2-40 UTF-8 bytes. Missing signals.read
        permission or organization membership returns a generic 403. All
        responses include Cache-Control: no-store and Pragma: no-cache.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization and must match the authenticated membership.
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          required: false
          description: First value is used; additional values are ignored.
          schema:
            type: string
            enum: [red, orange, green]
        - name: module
          in: query
          required: false
          description: First value is used; additional values are ignored. Length is measured in UTF-8 bytes.
          schema:
            type: string
            x-minBytes: 2
            x-maxBytes: 40
      responses:
        "200":
          description: Signals for the active organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "400":
          description: The organization selector or query parameters are malformed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the identity is not verified or does not resolve to an organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The explicit organization selector does not match the resolved membership, or the actor lacks signals.read. The message is generic.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The exact path is owned by Go and only GET is enabled. Suffix paths continue to the configured fallback.
          headers:
            Allow:
              schema:
                type: string
                const: GET
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure, the signal capability, or its response failed. The message is generic.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Signals dependencies or session configuration are unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: Read the authenticated organization dashboard
      description: >-
        Returns the dashboard snapshot for the authenticated organization. The
        response includes organization-scoped financial, working-capital,
        pipeline, operations, trend, activity, and signal data. Report-derived
        money fields use the legacy zero or null fallback when the actor cannot
        read the corresponding accounting report. Every response includes
        Cache-Control: no-store and Pragma: no-cache. Cookie sessions use the
        active organization from session context unless X-Organization-ID is
        supplied. Bearer tokens are resolved against the selected organization.
        An explicit organization selector must match the resolved membership.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the organization for this request and must match an organization membership.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard snapshot for the authenticated organization.
          headers:
            Cache-Control:
              description: Dashboard responses are not stored by clients or intermediaries.
              schema:
                type: string
                const: no-store
            Pragma:
              description: Legacy cache prevention header.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: The organization selector is malformed or repeated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not a verified organization member.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The explicit organization selector does not match the authenticated actor's organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: GET
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The tenant-scoped dashboard read failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The dashboard service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/setup:
    get:
      operationId: getSetupChecklist
      summary: Read the organization setup checklist
      description: >-
        Returns the setup checklist for the authenticated organization. The
        checklist's completion flags include organization-scoped counts plus
        runtime configuration for SMTP_HOST and installed coding-agent
        executables. Cookie sessions use the active-organization cookie unless
        X-Organization-ID is supplied; bearer tokens are resolved against the
        selected organization. A supplied selector must match the resolved
        organization. The verified actor must have iam.admin or wildcard
        permission, and the request must resolve to an authenticated session
        with an active organization. This read does not require Origin. Query
        parameters and request bodies are ignored. Responses include
        Cache-Control: no-store and Pragma: no-cache. The router mounts only
        GET for this exact path while the handler is enabled; unsupported
        methods receive 405, and suffix paths continue to the base handler.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization membership for the request.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The organization setup checklist.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          description: The organization selector is malformed or repeated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid, unverified, missing an active organization, or missing its authenticated session identity.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The selected organization does not match the resolved session or the actor lacks iam.admin or wildcard permission.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The exact setup path received an unsupported method before authentication.
          headers:
            Allow:
              description: The supported request method.
              schema:
                type: string
                const: GET
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The tenant-scoped setup checklist read failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The setup service dependencies are unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/capabilities/execute:
    post:
      operationId: executeCapability
      summary: Execute an authenticated business capability
      description: Executes one capability through the governed kernel using the authenticated actor and active organization. Input and output remain open-ended at this generic boundary; capability-specific shapes are checked by runtime validators. Cookie-authenticated requests must include a same-origin Origin header. Bearer-authenticated requests do not use the browser origin check. If X-Organization-ID is provided, it must match the authenticated active organization.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the active organization when the authenticated identity belongs to more than one organization.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityExecutionRequest"
      responses:
        "200":
          description: Capability completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityExecutionSuccess"
        "202":
          description: Capability is waiting for human approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityExecutionPending"
        "400":
          description: Request body or capability execution envelope is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or does not identify an authenticated organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The origin is not allowed or the actor cannot perform the requested action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Capability input was valid JSON but the capability refused the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CapabilityExecutionRefusal"
                  - $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A capability-specific rate limit was reached.
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Capability execution failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Capability execution is unavailable or the requested capability is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only POST is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/modules:
    get:
      operationId: getModuleSwitchboard
      summary: Read the organization module switchboard
      description: >-
        Returns the module catalog and effective module selection for the authenticated organization. Every response includes Cache-Control: no-store and Pragma: no-cache. Cookie sessions use the active organization from session context unless X-Organization-ID is supplied. Bearer tokens are resolved against the selected organization, and an explicit selection must match an organization membership. This read does not require an Origin header.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the organization for this request. The server rejects malformed selectors and cookie sessions cannot select an organization they do not belong to.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The module catalog and effective module selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleSwitchboardResponse"
        "400":
          description: The organization selector is malformed or repeated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not an authenticated organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The requested organization does not match the authenticated actor's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The module service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
