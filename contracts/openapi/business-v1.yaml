openapi: 3.1.0
info:
  title: Chaste Business API
  version: 1.0.0
  description: Versioned public HTTP contracts shared by the Go API and its clients.
paths:
  /api/org:
    get:
      operationId: getOrganizations
      summary: List organizations available to the signed-in user
      description: >-
        Returns the authenticated user's organization memberships and active
        organization. The Better Auth session cookie is the only supported
        authentication mechanism for this route. The active organization is
        selected from the server-resolved session and HttpOnly active-org
        cookie; X-Organization-ID is not read here. An unverified user receives
        an empty orgs list and a null activeOrgId. Responses include
        Cache-Control: no-store. No Origin header is required for this read.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Organization memberships and active selection.
          headers:
            Cache-Control:
              description: Organization membership data is not stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "401":
          description: The Better Auth session is missing or invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or the organization membership query failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: switchActiveOrganization
      summary: Switch the active organization
      description: >-
        Verifies membership in the requested organization and sets the
        HttpOnly active-org cookie. Only Better Auth cookie sessions are
        supported. The request must include a same-origin Origin header and the
        session email must be verified. This endpoint does not accept an
        X-Organization-ID selector; orgId in the body is the requested target.
        Every response includes Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: JSON request body limited to 4096 bytes.
        x-maxBodyBytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSwitchRequest"
      responses:
        "200":
          description: Active organization cookie was set.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: HttpOnly, SameSite=Lax chaste_active_org cookie scoped to /.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSwitchSuccess"
        "400":
          description: The body is malformed or orgId is not a UUID.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The Better Auth session is missing or invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The Origin is not same-origin, the email is unverified, or the user is not a member of orgId.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or membership verification failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganizationAgentSoul
      summary: Update the organization's agent persona
      description: >-
        Replaces the standing agent persona for the active organization. This
        cookie-session route requires an active organization, iam.admin, and a
        same-origin Origin header. The body is limited to 65536 bytes. The
        agentSoul value is trimmed before storage; whitespace-only text clears
        the persona. Its maximum is 8000 UTF-16 code units. Unknown object
        properties are accepted and ignored.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        x-maxBodyBytes: 65536
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSoulPatchRequest"
      responses:
        "200":
          description: Agent persona was updated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWriteSuccess"
        "400":
          description: The body is malformed, agentSoul is absent or null, or the UTF-16 length exceeds 8000 code units.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or has no active organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The Origin is not same-origin or the actor lacks iam.admin.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or updating the agent persona failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: getOrganizationAgentSoul
      summary: Read the organization's agent persona
      description: >-
        Reads the standing agent persona for the active organization. This
        cookie-session route requires an active organization, but does not
        require iam.admin or an Origin header. Every response includes
        Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current agent persona.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSoulResponse"
        "401":
          description: The session is invalid or has no active organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Session resolution infrastructure or reading the agent persona failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The session service is misconfigured.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: The authenticated request used an unsupported method. This route supports GET, POST, PATCH, and PUT.
          headers:
            Allow:
              description: Methods accepted by this route.
              schema:
                type: string
                const: GET, POST, PATCH, PUT
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: Read the authenticated organization dashboard
      description: >-
        Returns the dashboard snapshot for the authenticated organization. The
        response includes organization-scoped financial, working-capital,
        pipeline, operations, trend, activity, and signal data. Report-derived
        money fields use the legacy zero or null fallback when the actor cannot
        read the corresponding accounting report. Every response includes
        Cache-Control: no-store and Pragma: no-cache. Cookie sessions use the
        active organization from session context unless X-Organization-ID is
        supplied. Bearer tokens are resolved against the selected organization.
        An explicit organization selector must match the resolved membership.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the organization for this request and must match an organization membership.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard snapshot for the authenticated organization.
          headers:
            Cache-Control:
              description: Dashboard responses are not stored by clients or intermediaries.
              schema:
                type: string
                const: no-store
            Pragma:
              description: Legacy cache prevention header.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: The organization selector is malformed or repeated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not a verified organization member.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The explicit organization selector does not match the authenticated actor's organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: GET
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The tenant-scoped dashboard read failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The dashboard service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/capabilities/execute:
    post:
      operationId: executeCapability
      summary: Execute an authenticated business capability
      description: Executes one capability through the governed kernel using the authenticated actor and active organization. Input and output remain open-ended at this generic boundary; capability-specific shapes are checked by runtime validators. Cookie-authenticated requests must include a same-origin Origin header. Bearer-authenticated requests do not use the browser origin check. If X-Organization-ID is provided, it must match the authenticated active organization.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the active organization when the authenticated identity belongs to more than one organization.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityExecutionRequest"
      responses:
        "200":
          description: Capability completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityExecutionSuccess"
        "202":
          description: Capability is waiting for human approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityExecutionPending"
        "400":
          description: Request body or capability execution envelope is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or does not identify an authenticated organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The origin is not allowed or the actor cannot perform the requested action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Capability input was valid JSON but the capability refused the request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CapabilityExecutionRefusal"
                  - $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A capability-specific rate limit was reached.
          headers:
            Retry-After:
              description: Seconds until the request can be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Capability execution failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Capability execution is unavailable or the requested capability is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only POST is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/modules:
    get:
      operationId: getModuleSwitchboard
      summary: Read the organization module switchboard
      description: >-
        Returns the module catalog and effective module selection for the authenticated organization. Every response includes Cache-Control: no-store and Pragma: no-cache. Cookie sessions use the active organization from session context unless X-Organization-ID is supplied. Bearer tokens are resolved against the selected organization, and an explicit selection must match an organization membership. This read does not require an Origin header.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the organization for this request. The server rejects malformed selectors and cookie sessions cannot select an organization they do not belong to.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The module catalog and effective module selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleSwitchboardResponse"
        "400":
          description: The organization selector is malformed or repeated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not an authenticated organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The requested organization does not match the authenticated actor's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The module service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setModuleSwitchboard
      summary: Update the organization module switchboard
      description: >-
        Updates enabled modules through the governed iam.setModules capability. Every response includes Cache-Control: no-store and Pragma: no-cache. The authenticated actor must have iam.admin. Cookie-authenticated requests must include a same-origin Origin header. Bearer-authenticated requests bypass the browser Origin check. The request includes the current catalog module IDs, and the server preserves protected modules automatically.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the organization for this request and must match an organization membership.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleSwitchboardRequest"
      responses:
        "200":
          description: The module switchboard update completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityExecutionSuccess"
        "202":
          description: The module change is waiting for approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleSwitchboardPending"
        "400":
          description: The organization selector or request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not a verified organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The origin is disallowed, the actor lacks iam.admin, or organization membership is no longer valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The governed capability refused the module change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The governed module update failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The module write service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only POST is supported.
          headers:
            Allow:
              description: Allowed request method.
              schema:
                type: string
                const: POST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/approvals:
    get:
      operationId: getApprovalInbox
      summary: Read pending approvals and recent decisions
      description: >-
        Reads the authenticated organization's approval queue and recent
        history. Cookie sessions use the active organization from session
        context unless X-Organization-ID is supplied; bearer tokens are
        resolved against the selected organization. An explicit selector must
        match the authenticated membership. Cookie reads do not require an
        Origin header. Responses include Cache-Control: no-store and
        Pragma: no-cache.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization membership for the request.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Up to 100 pending approvals and up to 25 recent decisions.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalInboxResponse"
        "400":
          description: The organization selector is malformed or repeated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The actor has no valid verified session for an organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The explicit organization selector does not match the resolved membership.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Only GET is supported.
          headers:
            Allow:
              schema:
                type: string
                const: GET
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The organization-scoped inbox read failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The approval inbox service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: decideApproval
      summary: Approve or reject a pending action
      description: >-
        Decides one pending approval in the authenticated organization. Supply
        exactly one non-empty approval id in the id query parameter. The
        handler reports malformed or non-existent IDs as not found. Cookie-authenticated
        requests must pass the server's same-origin Origin check; bearer
        requests do not use that browser check. An explicit X-Organization-ID
        is used to resolve the organization and resolution failures return 401
        with a Bearer challenge. Approval execution requires the permission for
        the approved capability. Request bodies are limited to 16 KiB.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Approval ID to decide. The handler requires exactly one non-empty value; malformed IDs are reported as not found.
          schema:
            type: string
            minLength: 1
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects the active organization and must match membership.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Approval was rejected or approved and its action executed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionSuccess"
        "400":
          description: The ID query or decision body is malformed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ApprovalDecisionFailure"
        "401":
          description: Authentication is invalid, the actor is not a verified organization member, or organization selection failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ApprovalDecisionFailure"
        "403":
          description: The cookie request origin is disallowed or the actor lacks authority over this capability.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ApprovalDecisionFailure"
        "404":
          description: No approval with this ID exists in the authenticated organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionFailure"
        "405":
          description: Only POST is supported.
          headers:
            Allow:
              schema:
                type: string
                const: POST
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This approval has already been handled or is being executed elsewhere.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionFailure"
        "410":
          description: The approval expired before it could be decided.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionFailure"
        "422":
          description: The approved capability is unsupported or refused execution.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionFailure"
        "500":
          description: The decision or approved action failed unexpectedly.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ApprovalDecisionFailure"
        "503":
          description: The approval decision service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/notifications:
    get:
      operationId: getNotifications
      summary: List notifications for the authenticated user
      description: >-
        Returns notifications visible to the authenticated user in the resolved
        organization, newest first, with an unread count across the full visible
        feed. Cookie sessions use their active organization unless
        X-Organization-ID is provided; bearer tokens are resolved against the
        selected organization. A supplied selector must match the resolved
        membership. Cookie and bearer authentication are supported. Reads
        include Cache-Control: no-store and Pragma: no-cache. Query limit
        defaults to 30, is clamped to 1 through 100, and invalid numeric values
        fall back to 30. If Authorization is present, it must contain a valid
        Bearer token; an invalid Authorization value does not fall back to the
        session cookie.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization membership for the request.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: >-
            Requested result count. Values are parsed as numbers and floored;
            values below 1 clamp to 1, above 100 clamp to 100, and invalid or
            non-finite values use the default of 30. An explicitly empty value
            clamps to 1.
          schema:
            type: string
            example: "20"
      responses:
        "200":
          description: Notifications and unread count.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "400":
          description: The organization selector is malformed or repeated.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid verified session is available for an organization.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The explicit organization selector does not match the resolved membership.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Notification feed retrieval failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The notification service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: >-
            The mounted Go route received an unsupported method. The exact-path
            method guard runs before authentication. With the default full
            route, GET and POST are mounted; disabled methods continue to the
            base owner.
          headers:
            Allow:
              description: Configured methods on the exact Go-owned path.
              schema:
                type: string
                const: GET, POST
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: >-
        Marks a visible notification as read through the governed
        notifications.markRead capability. Cookie and bearer authentication
        are supported. Cookie-authenticated requests must include a same-origin
        Origin header; bearer-authenticated requests do not require Origin.
        If Authorization is present, it must contain a valid Bearer token; an
        invalid Authorization value does not fall back to the session cookie.
        Cookie sessions use their active organization unless X-Organization-ID
        is provided; bearer tokens are resolved against the selected
        organization. A supplied selector must match the resolved membership.
        The strict JSON body is limited to 8192 bytes and rejects unknown
        properties. The optional intentId is carried to the capability executor
        as the idempotency key. Repeated marks are safe: the endpoint returns
        the same {ok:true} success envelope when an existing receipt is reused.
        Responses include Cache-Control: no-store.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: X-Organization-ID
          in: header
          required: false
          description: Selects an organization membership for the request.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Strict JSON body limited to 8192 bytes.
        x-maxBodyBytes: 8192
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadRequest"
      responses:
        "200":
          description: The notification was found and marked as read, including when already read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadSuccess"
        "400":
          description: The organization selector or strict request body is invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid verified session is available for an organization, or the capability session is invalid.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The selector does not match membership, or cookie request origin is not same-origin.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No visible notification exists with the supplied ID.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The governed capability rejected the requested mutation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadFailure"
        "500":
          description: Capability execution or result validation failed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The notification service is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: >-
            The mounted Go route received an unsupported method. The exact-path
            method guard runs before authentication. With the default full
            route, GET and POST are mounted; disabled methods continue to the
            base owner.
          headers:
            Allow:
              description: Configured methods on the exact Go-owned path.
              schema:
                type: string
                const: GET, POST
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/support/channels:
    get:
      operationId: getSupportChannels
      summary: Read support channel settings
      description: Reads the current organization's support channel settings. The embed token is returned only to members with permission to manage support.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Current support channel settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChannelsResponse"
        "401":
          description: The session is invalid or the actor is not an organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The support module is not enabled for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The settings could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Support settings are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: updateSupportChannels
      summary: Update support channel settings
      description: Updates support settings for the active organization. Cookie-authenticated requests must include a same-origin Origin header. At least one field must be provided.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID for this exact settings update. Reuse it with the same body after an uncertain result.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChannelsPatch"
      responses:
        "202":
          description: The change is waiting for an authorized reviewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalResponse"
        "200":
          description: Updated support channel settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportChannelsResponse"
        "400":
          description: The patch is malformed, empty, or outside the supported bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is invalid or the actor is not an organization member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The origin is not allowed or the actor cannot manage support settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The support module is not enabled for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The settings could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The capability rejected the requested change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Support settings are temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, baseCurrency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        baseCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
    OrganizationListResponse:
      type: object
      additionalProperties: false
      required: [activeOrgId, orgs]
      properties:
        activeOrgId:
          type: [string, "null"]
          format: uuid
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"
    OrganizationSwitchRequest:
      type: object
      additionalProperties: true
      required: [orgId]
      properties:
        orgId:
          type: string
          format: uuid
    OrganizationSwitchSuccess:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    AgentSoulResponse:
      type: object
      additionalProperties: false
      required: [agentSoul]
      properties:
        agentSoul:
          type: string
    OrganizationSoulPatchRequest:
      type: object
      additionalProperties: true
      required: [agentSoul]
      properties:
        agentSoul:
          type: string
          x-maxUtf16Length: 8000
          description: Trimmed before storage; an empty or whitespace-only value clears the persona. The server rejects values exceeding 8000 UTF-16 code units.
    OrganizationWriteSuccess:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    DashboardSignal:
      type: object
      additionalProperties: false
      required: [id, severity, module, subject, detail]
      properties:
        id:
          type: string
          minLength: 1
        severity:
          type: string
          enum: [red, orange, green]
        module:
          type: string
          minLength: 1
        subject:
          type: string
        detail:
          type: string
        evidence:
          type: [object, "null"]
          additionalProperties: false
          required: [refType]
          properties:
            refType:
              type: string
            refId:
              type: [string, "null"]
        suggestedAction:
          type: [object, "null"]
          additionalProperties: false
          required: [capabilityId]
          properties:
            capabilityId:
              type: string
              minLength: 1
            inputDraft:
              type: object
              additionalProperties: true
              x-go-type: apicontract.RawJSON
              x-go-type-import:
                path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
                name: apicontract
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [signals, money, workingCapital, pipeline, ops, trend, activity]
      properties:
        signals:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/DashboardSignal"
        money:
          type: object
          additionalProperties: false
          required: [revenueMinor, expenseMinor, netIncomeMinor, cashMinor, balanced, assetsMinor, liabilitiesMinor, equityMinor]
          properties:
            revenueMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            expenseMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            netIncomeMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            cashMinor:
              type: [integer, "null"]
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            balanced:
              type: [boolean, "null"]
            assetsMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            liabilitiesMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            equityMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        workingCapital:
          type: object
          additionalProperties: false
          required: [arOutstandingMinor, overdueCount, overdueAmountMinor, apOutstandingMinor]
          properties:
            arOutstandingMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            overdueCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            overdueAmountMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
            apOutstandingMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        pipeline:
          type: object
          additionalProperties: false
          required: [stages, openCount, weightedForecastMinor]
          properties:
            stages:
              type: array
              minItems: 6
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                required: [stage, count, valueMinor]
                properties:
                  stage:
                    type: string
                    enum: [lead, qualified, proposal, negotiation, won, lost]
                  count:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
                  valueMinor:
                    type: integer
                    format: int64
                    minimum: -9007199254740991
                    maximum: 9007199254740991
            openCount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            weightedForecastMinor:
              type: integer
              format: int64
              minimum: -9007199254740991
              maximum: 9007199254740991
        ops:
          type: object
          additionalProperties: false
          required: [headcount, pendingLeave, posOpen, lowStock, pendingApprovals, docsParsed, docsAwaitingCoding]
          properties:
            headcount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            pendingLeave:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            posOpen:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [register]
                  properties:
                    register:
                      type: string
            lowStock:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [sku, name]
                properties:
                  sku:
                    type: string
                  name:
                    type: string
            pendingApprovals:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            docsParsed:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            docsAwaitingCoding:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
        trend:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [month, incomeMinor, expenseMinor]
            properties:
              month:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
              incomeMinor:
                type: integer
                format: int64
                minimum: -9007199254740991
                maximum: 9007199254740991
              expenseMinor:
                type: integer
                format: int64
                minimum: -9007199254740991
                maximum: 9007199254740991
        activity:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [seq, kind, capabilityId, actorType, occurredAt]
            properties:
              seq:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              kind:
                type: string
              capabilityId:
                type: [string, "null"]
              actorType:
                type: string
              occurredAt:
                type: string
                format: date-time
    CapabilityExecutionRequest:
      type: object
      additionalProperties: false
      required: [capabilityId, input]
      properties:
        capabilityId:
          type: string
          minLength: 1
          maxLength: 200
          description: Capability registry identifier, limited to 200 Unicode code points by the server. Capability-specific input is validated by its runtime parser.
        input:
          description: Arbitrary JSON value. The Go implementation retains the raw JSON bytes for exact capability parsing and hashing.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
        intentId:
          type: [string, "null"]
          maxLength: 200
          description: Optional idempotency intent, limited to 200 Unicode code points. The server rejects CR, LF, and NUL characters.
    CapabilityExecutionSuccess:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: Arbitrary JSON value. Raw JSON avoids rounding large integer values in Go clients.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
    CapabilityExecutionPending:
      type: object
      additionalProperties: false
      required: [ok, pendingApproval, reason]
      properties:
        ok:
          type: boolean
          const: false
        pendingApproval:
          type: boolean
          const: true
        reason:
          type: string
        approvalId:
          type: string
          minLength: 1
    CapabilityExecutionRefusal:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: false
        data:
          description: Arbitrary JSON value. Raw JSON avoids rounding large integer values in Go clients.
          x-go-type: apicontract.RawJSON
          x-go-type-import:
            path: github.com/benaiah-muga/ChasteBusinessOS/apps/api/internal/apicontract
            name: apicontract
        error:
          type: string
        approvalId:
          type: string
        approvalRationale:
          type: string
        replayed:
          type: boolean
    ModuleInfo:
      type: object
      additionalProperties: false
      required: [id, label, description, href]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        description:
          type: string
        href:
          type: [string, "null"]
        protected:
          type: boolean
    ModuleSwitchboardResponse:
      type: object
      additionalProperties: false
      required: [catalog, enabledModules, usingDefaults]
      properties:
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/ModuleInfo"
        enabledModules:
          type: array
          items:
            type: string
        usingDefaults:
          type: boolean
    ModuleSwitchboardRequest:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            description: A currently cataloged module ID. The handler validates each value against its current module catalog.
        intentId:
