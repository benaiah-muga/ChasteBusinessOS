            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionFailure"
        "405":
          description: Only POST is supported.
          headers:
            Allow:
              schema:
