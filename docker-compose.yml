services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chaste
      POSTGRES_PASSWORD: chaste
      POSTGRES_DB: chaste
    ports:
      - "5432:5432"
    volumes:
      - chaste_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaste -d chaste"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chaste_pg:
