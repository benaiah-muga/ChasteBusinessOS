name: Release

# Builds the four Docker images from the tagged commit, pushes them to GHCR,
# and creates a GitHub Release with changelog-derived notes.
#
# Trigger: push a tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:migrate-${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:migrate-latest

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:api-${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:api-latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:web-${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:web-latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:worker-${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:worker-latest

      - name: Generate release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          VER="${RELEASE_VERSION#v}"
          {
            echo "## Container images (GHCR)"
            echo ""
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:api-${RELEASE_VERSION}\`"
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:web-${RELEASE_VERSION}\`"
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:worker-${RELEASE_VERSION}\`"
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:migrate-${RELEASE_VERSION}\`"
            echo ""
            echo "## Changelog"
            echo ""
            awk -v ver="$VER" '
              /^## \[/ {
                if (in_section) exit
                if ($0 ~ ("^## \\[" ver "\\]")) in_section = 1
              }
              in_section
            ' CHANGELOG.md
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
